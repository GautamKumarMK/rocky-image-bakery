# files/goss.yaml
service:
  qemu-guest-agent:
    enabled: true
    running: false
  firewalld:
    enabled: true
    running: true
  fail2ban:
    enabled: true
    running: true
  sshd:
    enabled: true
    running: true
  chronyd:
    enabled: true
    running: true
  # Note: We don't assert fluent-bit is running here, because your 
  # golden image logic intentionally leaves it stopped until clone boot.

package:
  ipset:
    installed: true
  fail2ban-firewalld:
    installed: true

port:
  tcp:22:
    listening: true
    ip:
      - 0.0.0.0

file:
  /etc/ssh/sshd_config.d/00-hardening.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    contents:
      - "PermitRootLogin no" # All these are just substring checks
      - "PasswordAuthentication no"
      - "AllowGroups ssh-users"

  /etc/fail2ban/jail.local:
    exists: true
    mode: "0644"
    contents:
      - "banaction = firewallcmd-ipset"
      - "bantime.increment = true"
      - "maxretry"

user:
  fluent-bit:
    exists: true
    groups:
      - systemd-journal
      - fluent-bit

group:
  ssh-users:
    exists: true

command:
  sshd_config_check:
    exec: "sshd -t"
    exit-status: 0
  
  chrony_synced:
    exec: "chronyc waitsync 30 0.5 0 0"
    exit-status: 0
  
  firewalld_ssh_allowed:
    exec: "firewall-cmd --query-service=ssh"
    exit-status: 0
  
  sshd_effective_config:
    exec: "sshd -T | grep -i '^permitrootlogin no'"
    exit-status: 0